services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ./configs/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: ${GRAFANA_INSTALL_PLUGINS:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    ports:
      - "9100:9100"
    networks:
      - monitoring

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: unless-stopped
    cap_add:
      - NET_RAW
    volumes:
      - ./configs/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - monitoring

  pushgateway:
    image: prom/pushgateway:v1.9.0
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - monitoring

  suricata:
    image: jasonish/suricata:latest
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_NICE
    environment:
      SURICATA_INTERFACE: ${SURICATA_INTERFACE:-eth0}
    command: >
      --af-packet=${SURICATA_INTERFACE:-eth0}
      -c /etc/suricata/suricata.yaml
      -v
    volumes:
      - ./configs/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./configs/suricata/rules:/etc/suricata/rules:ro
      - suricata-data:/var/log/suricata

  suricata-exporter:
    build:
      context: ./suricata-exporter
      network: ${DOCKER_BUILD_NETWORK:-default}
    restart: unless-stopped
    environment:
      EVE_JSON_PATH: /var/log/suricata/eve.json
      EXPORTER_PORT: "9517"
      ROLLING_WINDOW_SECONDS: "3600"
      SENSOR_STALE_AFTER_SECONDS: "30"
      LOG_LEVEL: "INFO"
    volumes:
      - suricata-data:/var/log/suricata:ro
    ports:
      - "9517:9517"
    depends_on:
      - suricata
    networks:
      - monitoring

  portal:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./configs/portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ui-preview/index.html:/usr/share/nginx/html/index.html:ro
      - ./ui-preview/app.js:/usr/share/nginx/html/app.js:ro
      - ./ui-preview/styles.css:/usr/share/nginx/html/styles.css:ro
      - ./docs:/usr/share/nginx/html/docs:ro
    ports:
      - "8088:80"
    depends_on:
      - grafana
      - ml-anomaly
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - monitoring

  ml-anomaly:
    build:
      context: ./ml-anomaly
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        PIP_RETRIES: ${PIP_RETRIES:-10}
        PIP_TIMEOUT: ${PIP_TIMEOUT:-120}
    restart: unless-stopped
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      CONFIG_PATH: /app/config.yaml
      UNSW_MODEL_PATH: /app/models/unsw_nb15_model.joblib
      UNSW_DATA_DIR: /Data/UNSW-NB15 dataset/CSV Files/Training and Testing Sets
      ZABBIX_URL: http://${ZABBIX_WEB_STATIC_IP:-172.30.0.12}:8080/api_jsonrpc.php
      ZABBIX_ADMIN_USER: ${ZABBIX_ADMIN_USER:-Admin}
      ZABBIX_ADMIN_PASSWORD: ${ZABBIX_ADMIN_PASSWORD:-zabbix}
      ZABBIX_REFRESH_SECONDS: ${ZABBIX_REFRESH_SECONDS:-15}
      ZABBIX_AGENT_CORE_IP: ${ZABBIX_AGENT_CORE_IP:-172.30.0.20}
      ZABBIX_AGENT_APPLICATION_IP: ${ZABBIX_AGENT_APPLICATION_IP:-172.30.0.21}
      ZABBIX_AGENT_DATABASE_IP: ${ZABBIX_AGENT_DATABASE_IP:-172.30.0.22}
      ZABBIX_AGENT_SECURITY_IP: ${ZABBIX_AGENT_SECURITY_IP:-172.30.0.23}
      ZABBIX_AGENT_WEB_IP: ${ZABBIX_AGENT_WEB_IP:-172.30.0.24}
      ZABBIX_AGENT_API_IP: ${ZABBIX_AGENT_API_IP:-172.30.0.25}
      ZABBIX_AGENT_BACKUP_IP: ${ZABBIX_AGENT_BACKUP_IP:-172.30.0.26}
    volumes:
      - ./ml-anomaly/app.py:/app/app.py:ro
      - ./ml-anomaly/config.yaml:/app/config.yaml:ro
      - ./ml-anomaly/models:/app/models
      - ./Data:/Data:ro
    ports:
      - "8000:8000"
    depends_on:
      - prometheus
      - node-exporter
      - blackbox-exporter
    networks:
      - monitoring
      - zabbix-private

  zabbix-db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_bin"
      - "--default-authentication-plugin=mysql_native_password"
    environment:
      MYSQL_DATABASE: ${ZABBIX_DB_NAME:-zabbix}
      MYSQL_USER: ${ZABBIX_DB_USER:-zabbix}
      MYSQL_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
      MYSQL_ROOT_PASSWORD: ${ZABBIX_DB_ROOT_PASSWORD:-zabbix-root}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${ZABBIX_DB_ROOT_PASSWORD:-zabbix-root} --silent || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - zabbix-db-data:/var/lib/mysql
    networks:
      monitoring:
      zabbix-private:
        ipv4_address: ${ZABBIX_DB_STATIC_IP:-172.30.0.10}

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0-latest
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: ${ZABBIX_DB_STATIC_IP:-172.30.0.10}
      MYSQL_DATABASE: ${ZABBIX_DB_NAME:-zabbix}
      MYSQL_USER: ${ZABBIX_DB_USER:-zabbix}
      MYSQL_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
      MYSQL_ROOT_PASSWORD: ${ZABBIX_DB_ROOT_PASSWORD:-zabbix-root}
    depends_on:
      zabbix-db:
        condition: service_healthy
    ports:
      - "10051:10051"
    networks:
      monitoring:
      zabbix-private:
        ipv4_address: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}
      ZBX_SERVER_PORT: 10051
      DB_SERVER_HOST: ${ZABBIX_DB_STATIC_IP:-172.30.0.10}
      MYSQL_DATABASE: ${ZABBIX_DB_NAME:-zabbix}
      MYSQL_USER: ${ZABBIX_DB_USER:-zabbix}
      MYSQL_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
      MYSQL_ROOT_PASSWORD: ${ZABBIX_DB_ROOT_PASSWORD:-zabbix-root}
      PHP_TZ: Asia/Colombo
    depends_on:
      zabbix-db:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "8080:8080"
    networks:
      monitoring:
      zabbix-private:
        ipv4_address: ${ZABBIX_WEB_STATIC_IP:-172.30.0.12}

  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}
      ZBX_SERVER_PORT: 10051
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_PASSIVESERVERS: ${ZABBIX_PASSIVE_ALLOWED:-172.30.0.0/24}
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_ACTIVESERVERS: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}:10051
      ZBX_HOSTNAME: "Zabbix server"
    ports:
      - "10050:10050"
    depends_on:
      - zabbix-server
    networks:
      monitoring:
      zabbix-private:
        ipv4_address: ${ZABBIX_AGENT_CORE_IP:-172.30.0.20}

  zabbix-agent-application:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}
      ZBX_SERVER_PORT: 10051
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_PASSIVESERVERS: ${ZABBIX_PASSIVE_ALLOWED:-172.30.0.0/24}
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_ACTIVESERVERS: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}:10051
      ZBX_HOSTNAME: "NHMF Application Server"
    depends_on:
      - zabbix-server
    networks:
      monitoring:
      zabbix-private:
        ipv4_address: ${ZABBIX_AGENT_APPLICATION_IP:-172.30.0.21}

  zabbix-agent-database:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}
      ZBX_SERVER_PORT: 10051
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_PASSIVESERVERS: ${ZABBIX_PASSIVE_ALLOWED:-172.30.0.0/24}
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_ACTIVESERVERS: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}:10051
      ZBX_HOSTNAME: "NHMF Database Server"
    depends_on:
      - zabbix-server
    networks:
      monitoring:
      zabbix-private:
        ipv4_address: ${ZABBIX_AGENT_DATABASE_IP:-172.30.0.22}

  zabbix-agent-security:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}
      ZBX_SERVER_PORT: 10051
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_PASSIVESERVERS: ${ZABBIX_PASSIVE_ALLOWED:-172.30.0.0/24}
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_ACTIVESERVERS: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}:10051
      ZBX_HOSTNAME: "NHMF Security Server"
    depends_on:
      - zabbix-server
    networks:
      monitoring:
      zabbix-private:
        ipv4_address: ${ZABBIX_AGENT_SECURITY_IP:-172.30.0.23}

  zabbix-agent-web:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}
      ZBX_SERVER_PORT: 10051
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_PASSIVESERVERS: ${ZABBIX_PASSIVE_ALLOWED:-172.30.0.0/24}
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_ACTIVESERVERS: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}:10051
      ZBX_HOSTNAME: "NHMF Web Server"
    depends_on:
      - zabbix-server
    networks:
      monitoring:
      zabbix-private:
        ipv4_address: ${ZABBIX_AGENT_WEB_IP:-172.30.0.24}

  zabbix-agent-api:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}
      ZBX_SERVER_PORT: 10051
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_PASSIVESERVERS: ${ZABBIX_PASSIVE_ALLOWED:-172.30.0.0/24}
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_ACTIVESERVERS: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}:10051
      ZBX_HOSTNAME: "NHMF API Server"
    depends_on:
      - zabbix-server
    networks:
      monitoring:
      zabbix-private:
        ipv4_address: ${ZABBIX_AGENT_API_IP:-172.30.0.25}

  zabbix-agent-backup:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}
      ZBX_SERVER_PORT: 10051
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_PASSIVESERVERS: ${ZABBIX_PASSIVE_ALLOWED:-172.30.0.0/24}
      ZBX_ACTIVE_ALLOW: "true"
      ZBX_ACTIVESERVERS: ${ZABBIX_SERVER_STATIC_IP:-172.30.0.11}:10051
      ZBX_HOSTNAME: "NHMF Backup Server"
    depends_on:
      - zabbix-server
    networks:
      monitoring:
      zabbix-private:
        ipv4_address: ${ZABBIX_AGENT_BACKUP_IP:-172.30.0.26}

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  zabbix-db-data:
  suricata-data:

networks:
  monitoring:
    driver: bridge
  zabbix-private:
    driver: bridge
    ipam:
      config:
        - subnet: ${NHMF_ZABBIX_SUBNET:-172.30.0.0/24}
          ip_range: ${NHMF_ZABBIX_DYNAMIC_RANGE:-172.30.0.128/25}
