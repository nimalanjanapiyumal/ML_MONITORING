global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: "network-health-monitoring-framework"
    environment: "lab"

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "ml-anomaly"
    metrics_path: /metrics
    static_configs:
      - targets: ["ml-anomaly:8000"]

  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]

  - job_name: "suricata-exporter"
    scrape_interval: 15s
    metrics_path: /metrics
    static_configs:
      - targets: ["suricata-exporter:9517"]
        labels:
          service: "suricata-ids"

  - job_name: "blackbox-icmp"
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
          - 8.8.8.8
          - 1.1.1.1
          - prometheus
          - grafana
          - alertmanager
          - ml-anomaly
          - zabbix-web
          - zabbix-server
          - zabbix-db
          - zabbix-agent
          - zabbix-agent-application
          - zabbix-agent-database
          - zabbix-agent-security
          - zabbix-agent-web
          - zabbix-agent-api
          - zabbix-agent-backup
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "blackbox-http"
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://prometheus:9090/-/healthy
          - http://grafana:3000/api/health
          - http://alertmanager:9093/-/healthy
          - http://ml-anomaly:8000/health
          - http://portal
          - http://suricata-exporter:9517/health
          - http://zabbix-web:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: "blackbox-tcp"
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - zabbix-server:10051
          - zabbix-db:3306
          - zabbix-agent:10050
          - zabbix-agent-application:10050
          - zabbix-agent-database:10050
          - zabbix-agent-security:10050
          - zabbix-agent-web:10050
          - zabbix-agent-api:10050
          - zabbix-agent-backup:10050
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: target
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Example SNMP job. Enable after configuring configs/snmp/snmp.yml and a real SNMP target.
