groups:
  - name: network-health-baseline-alerts
    rules:
      - alert: TargetDown
        expr: up{job!~"blackbox-(icmp|http|tcp)"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Monitoring target is down"
          description: "Target {{ $labels.instance }} in job {{ $labels.job }} has been unreachable for more than 2 minutes."

      - alert: BlackboxProbeExporterDown
        expr: min by(job, instance) (up{job=~"blackbox-(icmp|http|tcp)"}) == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Blackbox probe exporter is unavailable"
          description: "Prometheus cannot execute probes for {{ $labels.job }} through {{ $labels.instance }}."

      - alert: ICMPProbeFailed
        expr: probe_success{job="blackbox-icmp"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "ICMP target is unreachable"
          description: "ICMP probe failed for {{ $labels.target }} for more than 2 minutes."

      - alert: TCPProbeFailed
        expr: probe_success{job="blackbox-tcp"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "TCP service is unreachable"
          description: "TCP connection probe failed for {{ $labels.target }} for more than 2 minutes."

      - alert: HighICMPLatency
        expr: avg_over_time(probe_duration_seconds{job="blackbox-icmp"}[2m]) > 0.20 and avg_over_time(probe_duration_seconds{job="blackbox-icmp"}[2m]) < 0.50
        for: 2m
        labels:
          severity: warning
          category: latency
        annotations:
          summary: "High ICMP latency detected"
          description: "Target {{ $labels.target }} has average ICMP probe duration above 200ms."

      - alert: CriticalICMPLatency
        expr: avg_over_time(probe_duration_seconds{job="blackbox-icmp"}[2m]) >= 0.50
        for: 2m
        labels:
          severity: critical
          category: latency
        annotations:
          summary: "Critical ICMP latency detected"
          description: "Target {{ $labels.target }} has average ICMP probe duration at or above 500ms."

      - alert: HTTPProbeFailed
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
          category: service
        annotations:
          summary: "HTTP health probe failed"
          description: "HTTP probe failed for {{ $labels.target }}."

      - alert: HighCPUUsage
        expr: (100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85) and (100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) < 95)
        for: 3m
        labels:
          severity: warning
          category: resource
        annotations:
          summary: "High CPU usage"
          description: "CPU usage on {{ $labels.instance }} is above 85% for more than 3 minutes."

      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) >= 95
        for: 3m
        labels:
          severity: critical
          category: resource
        annotations:
          summary: "Critical CPU usage"
          description: "CPU usage on {{ $labels.instance }} is at or above 95% for more than 3 minutes."

      - alert: HighMemoryUsage
        expr: ((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85) and ((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 < 95)
        for: 3m
        labels:
          severity: warning
          category: resource
        annotations:
          summary: "High memory usage"
          description: "Memory usage on {{ $labels.instance }} is above 85% for more than 3 minutes."

      - alert: CriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 >= 95
        for: 3m
        labels:
          severity: critical
          category: resource
        annotations:
          summary: "Critical memory usage"
          description: "Memory usage on {{ $labels.instance }} is at or above 95% for more than 3 minutes."

      - alert: HighDiskUsage
        expr: ((1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"})) * 100 > 85) and ((1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"})) * 100 < 95)
        for: 5m
        labels:
          severity: warning
          category: resource
        annotations:
          summary: "High disk usage"
          description: "Disk usage on {{ $labels.instance }} {{ $labels.mountpoint }} is above 85%."

      - alert: CriticalDiskUsage
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"})) * 100 >= 95
        for: 5m
        labels:
          severity: critical
          category: resource
        annotations:
          summary: "Critical disk usage"
          description: "Disk usage on {{ $labels.instance }} {{ $labels.mountpoint }} is at or above 95%."

      - alert: MLAnomalyDetected
        expr: nhmf_anomaly_severity_level == 2
        for: 30s
        labels:
          severity: warning
          category: ml-anomaly
        annotations:
          summary: "ML anomaly detected"
          description: "ML warning persisted for {{ $labels.metric_name }} on {{ $labels.target }}."

      - alert: MLCriticalAnomaly
        expr: nhmf_anomaly_severity_level == 3
        for: 15s
        labels:
          severity: critical
          category: ml-anomaly
        annotations:
          summary: "Critical ML anomaly detected"
          description: "Critical ML evidence persisted for {{ $labels.metric_name }} on {{ $labels.target }}."

  - name: suricata-ids-alerts
    rules:
      - alert: SuricataHighSeverityAlert
        expr: increase(suricata_alerts_total{severity="1"}[5m]) > 0
        for: 0m
        labels:
          severity: critical
          category: ids
        annotations:
          summary: "Suricata critical IDS alert fired"
          description: "Severity-1 Suricata alert detected in the last 5 minutes. Signature: {{ $labels.signature }}. Category: {{ $labels.category }}."

      - alert: SuricataAlertBurst
        expr: rate(suricata_alerts_total[1m]) * 60 > 50
        for: 2m
        labels:
          severity: warning
          category: ids
        annotations:
          summary: "Suricata alert burst — more than 50 alerts/min"
          description: "Alert rate exceeded 50/min for 2 consecutive minutes. Possible active attack or ruleset noise. Check signature: {{ $labels.signature }}."

      - alert: SuricataDropRateHigh
        expr: rate(suricata_drop_packets_total[1m]) * 60 > 100
        for: 1m
        labels:
          severity: warning
          category: ids
        annotations:
          summary: "Suricata packet drop rate is high"
          description: "Suricata is dropping more than 100 packets/min — performance issue or IPS rule overmatch. Review rule efficiency."

      - alert: SuricataExporterDown
        expr: up{job="suricata-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Suricata exporter is unreachable"
          description: "Prometheus cannot scrape suricata-exporter. IDS visibility is degraded."

      - alert: SuricataSensorDown
        expr: suricata_sensor_health == 0
        for: 30s
        labels:
          severity: critical
          category: ids
        annotations:
          summary: "Suricata sensor is stopped or stale"
          description: "The exporter has not received a fresh Suricata stats event. IDS packet inspection is unavailable."

  - name: zabbix-infrastructure-alerts
    rules:
      - alert: ZabbixWebDown
        expr: probe_success{job="blackbox-http", target=~"http://zabbix-web:8080.*"} == 0
        for: 2m
        labels:
          severity: critical
          category: zabbix
        annotations:
          summary: "Zabbix Web UI is down"
          description: "Blackbox HTTP probe failed to connect to Zabbix Web UI on port 8080."

      - alert: ZabbixServerUnreachable
        expr: probe_success{job="blackbox-tcp", target="zabbix-server:10051"} == 0
        for: 2m
        labels:
          severity: critical
          category: zabbix
        annotations:
          summary: "Zabbix Server daemon is unreachable"
          description: "Zabbix Server is not accepting TCP connections on port 10051."

      - alert: ZabbixDatabaseUnreachable
        expr: probe_success{job="blackbox-tcp", target="zabbix-db:3306"} == 0
        for: 2m
        labels:
          severity: critical
          category: zabbix
        annotations:
          summary: "Zabbix database is unreachable"
          description: "The Zabbix MySQL database is not accepting TCP connections on port 3306."

      - alert: ZabbixAgentUnreachable
        expr: zabbix_native_host_health == 0
        for: 2m
        labels:
          severity: critical
          category: zabbix
        annotations:
          summary: "Zabbix monitored server agent is unreachable"
          description: "Native Zabbix data marks {{ $labels.host }} ({{ $labels.role }}) as down, disabled, not registered, or unsupported by current agent data."

      - alert: ZabbixAgentPending
        expr: zabbix_native_host_health == 1
        for: 5m
        labels:
          severity: warning
          category: zabbix
        annotations:
          summary: "Zabbix monitored server is pending"
          description: "{{ $labels.host }} is registered but its Zabbix interface or agent.ping item is not yet confirmed healthy."

      - alert: ZabbixNativeAPIUnavailable
        expr: zabbix_native_api_up == 0
        for: 2m
        labels:
          severity: critical
          category: zabbix
        annotations:
          summary: "Native Zabbix data collection is unavailable"
          description: "Grafana cannot authenticate to or read the Zabbix API through the NHMF collector."

      - alert: ZabbixFleetDegraded
        expr: count(zabbix_native_host_health == 0) >= 2 and count(zabbix_native_host_health == 0) < 4
        for: 1m
        labels:
          severity: warning
          category: zabbix
        annotations:
          summary: "Multiple Zabbix monitored servers are unavailable"
          description: "Between two and three of the seven monitored server agents are unreachable. The fleet is degraded."

      - alert: ZabbixFleetCritical
        expr: count(zabbix_native_host_health == 0) >= 4
        for: 1m
        labels:
          severity: critical
          category: zabbix
        annotations:
          summary: "Zabbix monitored server fleet is critically degraded"
          description: "Four or more of the seven monitored server agents are unreachable."

      - alert: ZabbixWebHighLatency
        expr: probe_duration_seconds{job="blackbox-http", target=~"http://zabbix-web:8080.*"} > 0.5
        for: 2m
        labels:
          severity: warning
          category: zabbix
        annotations:
          summary: "Zabbix Web response latency is high"
          description: "Zabbix Web response duration exceeded 500ms for more than 2 minutes."
