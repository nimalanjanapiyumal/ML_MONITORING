server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The portal is an operations console. Always show the files from the
    # currently deployed repository instead of a browser/proxy cached copy.
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /version {
        default_type application/json;
        return 200 '{"portal":"nhmf","build":"2026.08.26-zabbix-controls-v1","features":["seven-server-status","zabbix-activation-controls","outage-scenarios"]}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
