global:
  resolve_timeout: 5m

route:
  receiver: default-lab-receiver
  group_by: ["alertname", "job", "severity"]
  group_wait: 20s
  group_interval: 2m
  repeat_interval: 2h
  routes:
    - matchers:
        - severity="critical"
      receiver: critical-lab-receiver
      repeat_interval: 30m

receivers:
  - name: default-lab-receiver
    webhook_configs:
      - url: "http://ml-anomaly:8000/alert-webhook"
        send_resolved: true

  - name: critical-lab-receiver
    webhook_configs:
      - url: "http://ml-anomaly:8000/alert-webhook"
        send_resolved: true

inhibit_rules:
  - source_matchers:
      - alertname="TargetDown"
    target_matchers:
      - severity="warning"
    equal: ["instance"]
